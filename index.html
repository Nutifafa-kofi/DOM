<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <title>Task Manager</title>
  </head>
  <body
    class="flex flex-col items-center bg-[#0F1116] text-white font-['Poppins'] text-sm min-h-screen"
  >
    <!-- Task Input Section -->
    <div class="flex items-center relative w-3xl">
      <input
        id="inputBox"
        type="text"
        placeholder="add a new task and press Enter..."
        class="rounded-2xl w-3xl p-6 m-4 border border-[#242832] bg-[#13161E] text-[#515970] text-lg"
      />

      <!-- Task Rank and Add Button Start -->

      <div class="absolute right-8 display flex items-center gap-4">
        <select
          name=""
          id="rank"
          class="border-[0.5px] border-gray-100 rounded-lg p-2 cursor-pointer bg-gray-900 text-slate-100 text-sm"
        >
          <option value="high">high</option>
          <option value="medium">medium</option>
          <option value="low">low</option>
        </select>
        <button
          onclick="addTask()"
          class="bg-[#5B7CFA] text-white p-2 rounded-md w-[120px] h-[40px] rounded-lg cursor-pointer"
        >
          + Add Task
        </button>
      </div>
    </div>
    <!-- Task Input Section End -->

    <!-- progress bar start -->
    <div class="w-3xl px-4 m-3">
      <div
        class="flex justify-between items-center mb-2 text-[#515970] text-sm"
      >
        <p class="">progress</p>
        <span id="progressText"> 0% </span>
      </div>

      <div class="h-1 w-full rounded-full bg-[#202326]">
        <div
          id="progressBar"
          class="h-1 rounded-full bg-cyan-200"
          style="width: 20%"
        ></div>
      </div>
    </div>
    <!-- progress bar end -->

    <!-- Task Filters Start -->
    <div class="m-4 relative right-60 text-xs">
      <button
        class="rounded-2xl px-4 py-1 cursor-pointer bg-[#5B7CFA] text-white"
      >
        all
      </button>
      <button
        class="border border-[#242832] py-1 rounded-2xl w-[100px] cursor-pointer text-[#515970]"
      >
        pending
      </button>
      <button
        class="border border-[#242832] py-1 rounded-2xl w-[100px] cursor-pointer text-[#515970]"
      >
        completed
      </button>
    </div>
    <!-- Task Filters End -->

    <h3 class="m-4 relative right-75 text-[#515970] text-xs">TASKS</h3>

    <!-- Task List Start-->
    <ul id="tasklist" class="flex flex-col gap-2">
      <li
        class="flex items-center gap-2 bg-[#1A1E2A] border border-[#2A2E39] w-3xl p-5 rounded-xl bg-[ #515970] relative"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer appearance-none border-2 border-[#2A2E39] hover:border-green-500 w-6 h-6 rounded-full checked:bg-green-500 checked:border-green-500 checked:after:content-['✓'] checked:after:flex checked:after:items-center checked:after:justify-center"
        />
        <span>Learn querySelector and getElementById</span>
        <span class="ml-auto text-[#F05B5B] text-xs rounded-md border border-[#F05B5B] px-3 py-1"
          >high</span
        >
        <button
          class="existingBtn text-gray-500 rounded-md text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>
      <li
        class="flex items-center gap-2 bg-[#1A1E2A] border border-[#2A2E39] w-3xl p-5 rounded-xl relative"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer appearance-none border-2 border-2 border-[#2A2E39] hover:border-green-500 w-6 h-6 rounded-full checked:bg-green-500 checked:border-green-500 checked:after:content-['✓'] checked:after:flex checked:after:items-center checked:after:justify-center"
        />
        <span>Understand addEventListener and event objects</span>
        <span class="ml-auto text-[#F05B5B] text-xs rounded-md border border-[#F05B5B] px-3 py-1"
          >high</span
        >
        <button
          class="existingBtn text-gray-500 rounded-md text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>

      <li
        class="flex items-center gap-2 bg-[#1A1E2A] border border-[#2A2E39] w-3xl p-5 rounded-xl relative"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer appearance-none border-2 border-2 border-[#2A2E39] hover:border-green-500 w-6 h-6 rounded-full checked:bg-green-500 checked:border-green-500 checked:after:content-['✓'] checked:after:flex checked:after:items-center checked:after:justify-center"
        />
        <span>Practice createElement and appendChild</span>
        <span
          class="ml-auto text-[#F0A52B] text-xs rounded-md border border[#F0A52B] px-3 py-1"
          >medium</span
        >
        <button
          class="existingBtn text-gray-500 rounded-md text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>

      <li
        class="flex items-center gap-2 bg-[#1A1E2A] border border-[#2A2E39] w-3xl p-5 rounded-xl relative"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer appearance-none border-2 border-2 border-[#2A2E39] hover:border-green-500 w-6 h-6 rounded-full checked:bg-green-500 checked:border-green-500 checked:after:content-['✓'] checked:after:flex checked:after:items-center checked:after:justify-center"
        />
        <span>Style elements with classList.add / toggle</span>
        <span
          class="ml-auto text-[#F0A52B] text-xs rounded-md border border[#F0A52B] px-3 py-1"
          >medium</span
        >
        <button
          class="existingBtn text-gray-500 rounded-md text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>

      <li
        class="flex items-center gap-2 bg-[#1A1E2A] border border-[#2A2E39] w-3xl p-5 rounded-xl relative"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer appearance-none border-2 border-2 border-[#2A2E39] hover:border-green-500 w-6 h-6 rounded-full checked:bg-green-500 checked:border-green-500 checked:after:content-['✓'] checked:after:flex checked:after:items-center checked:after:justify-center"
        />
        <span>Read MDN Web Docs every day</span>
        <span class="ml-auto text-[#27C282] text-xs rounded-md border border-[#27C282] px-3 py-1"
          >low</span
        >
        <button
          class="existingBtn text-gray-500 rounded-md text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>
    </ul>
  </body>
</html>
