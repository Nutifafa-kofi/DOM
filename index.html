<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <title>Document</title>
  </head>
  <body
    class="flex flex-col items-center bg-gray-950 text-white font-['Poppins'] text-sm"
  >
    <!-- Task Input Section -->
    <div class="flex items-center relative w-2xl">
      <input
        id="taskInput"
        type="text"
        placeholder="add a new task and press Enter..."
        class="border rounded-2xl w-2xl p-5 m-4 bg-gray-900 border-[0.5px]"
      />

      <!-- Task Rank and Add Button Start -->

      <div class="absolute right-8 display flex items-center gap-4">
        <select
          name=""
          id="rank"
          class="border-[0.5px] border-gray-100 rounded-lg p-2 cursor-pointer bg-gray-900 text-slate-100 text-sm"
        >
          <option value="high">high</option>
          <option value="medium">medium</option>
          <option value="low">low</option>
        </select>
        <button
          id="addBtn"
          class="bg-blue-500 text-white p-2 rounded-md w-[120px] h-[40px] rounded-lg cursor-pointer"
        >
          + Add Task
        </button>
      </div>
    </div>
    <!-- Task Input Section End -->

    <!-- Task Filters Start -->
    <div class="m-4 relative right-48">
      <button class="rounded-xl w-[50px] cursor-pointer bg-blue-500 text-white">
        all
      </button>
      <button class="border rounded-xl w-[100px] cursor-pointer">
        pending
      </button>
      <button class="border rounded-xl w-[100px] cursor-pointer">
        completed
      </button>
    </div>
    <!-- Task Filters End -->

    <h3 class="m-4 relative right-75 text-gray-700 text-sm">TASKS</h3>

    <!-- Task List Start-->
    <ul id="tasklist" class="flex flex-col gap-4">
      <li
        class="flex items-center gap-2 border w-2xl p-4 rounded-xl bg-gray-900"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer w-3 h-3 rounded-full"
        />
        <span>Learn querySelector and getElementById</span>
        <button
          class="existingBtn text-gray-500 rounded-md ml-auto text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>

      <li
        class="flex items-center gap-2 border w-2xl p-4 rounded-xl bg-gray-900"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer w-3 h-3 rounded-full"
        />
        <span>Understand addEventListener and event objects</span>
        <button
          class="existingBtn text-gray-500 rounded-md ml-auto text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>

      <li
        class="flex items-center gap-2 border w-2xl p-4 rounded-xl bg-gray-900"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer w-3 h-3 rounded-full"
        />
        <span>Practice createElement and appendChild</span>
        <button
          class="existingBtn text-gray-500 rounded-md ml-auto text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>

      <li
        class="flex items-center gap-2 border w-2xl p-4 rounded-xl bg-gray-900"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer w-3 h-3 rounded-full"
        />
        <span>Style elements with classList.add / toggle</span>
        <button
          class="existingBtn text-gray-500 rounded-md ml-auto text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>

      <li
        class="flex items-center gap-2 border w-2xl p-4 rounded-xl bg-gray-900"
      >
        <input
          type="checkbox"
          class="existingCheckbox cursor-pointer w-3 h-3 rounded-full"
        />
        <span>Read MDN Web Docs every day</span>
        <button
          class="existingBtn text-gray-500 rounded-md ml-auto text-xl hover:bg-transparent hover:text-red-300 hover:border border-red-300 w-6 h-6 flex items-center justify-center"
        >
          x
        </button>
      </li>
    </ul>
  </body>
</html>
